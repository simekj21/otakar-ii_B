<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Seznam listin — Itinerář Otakara II.</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #f5f3ef;
  --surface: #ffffff;
  --card: #f8f6f2;
  --border: #e0dbd0;
  --border2: #ccc7bb;
  --accent: #e05c5c;
  --accent2: #c94444;
  --accent-dim: #f0a0a0;
  --accent-bg: rgba(224, 92, 92, 0.08);
  --text: #1a1614;
  --text2: #4a4240;
  --text3: #888078;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg); color: var(--text); font-family: 'Lora', Georgia, serif; }
.container { max-width: 1400px; margin: 0 auto; padding: 20px; min-height: 100vh; }

.header { background: var(--accent); color: white; padding: 24px; border-radius: 8px; margin-bottom: 24px; }
.header h1 { font-family: 'Montserrat', sans-serif; font-size: 24px; font-weight: 700; margin-bottom: 4px; }
.header p { font-size: 14px; opacity: 0.95; }

.filters { background: white; padding: 20px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 24px; display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 16px; align-items: flex-end; }
.filter-group { display: flex; flex-direction: column; gap: 6px; }
.filter-group label { font-size: 11px; font-weight: 600; color: var(--accent); text-transform: uppercase; font-family: 'Montserrat', sans-serif; letter-spacing: 0.5px; }
.filter-group select, .filter-group input { padding: 8px 12px; border: 1px solid var(--border2); border-radius: 4px; font-family: 'Lora', serif; font-size: 13px; color: var(--text); background: white; cursor: pointer; width: 100%; }
.filter-group input { cursor: text; }
.filter-group select:focus, .filter-group input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }

.btn-reset { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; white-space: nowrap; height: fit-content; width: 100%; }
.btn-reset:hover { background: var(--accent2); }

.table-info { font-size: 12px; color: var(--text3); margin-bottom: 12px; padding: 12px; background: var(--card); border-radius: 4px; }

.table-wrapper { overflow-x: auto; background: white; border: 1px solid var(--border); border-radius: 8px; }
.data-table { width: 100%; font-size: 12px; border-collapse: collapse; }
.data-table th { background: var(--card); border-bottom: 2px solid var(--border2); padding: 10px; text-align: left; font-weight: 600; color: var(--accent); font-family: 'Montserrat', sans-serif; text-transform: uppercase; font-size: 11px; }
.data-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
.data-table tr:hover { background: var(--card); }

.pagination { display: flex; justify-content: center; gap: 8px; margin-top: 16px; align-items: center; flex-wrap: wrap; }
.pagination button, .pagination span { padding: 6px 10px; border: 1px solid var(--border2); border-radius: 4px; background: white; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; }
.pagination button:hover { background: var(--accent-bg); border-color: var(--accent); }
.pagination button.active { background: var(--accent); color: white; border-color: var(--accent); }
.pagination span { border: none; color: var(--text3); cursor: default; }

@media (max-width: 1024px) {
  .filters { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 640px) {
  .filters { grid-template-columns: 1fr; }
  .container { padding: 12px; }
  .header { padding: 16px; margin-bottom: 16px; }
  .header h1 { font-size: 20px; }
  .data-table { font-size: 11px; }
  .data-table td { padding: 6px 8px; }
  .btn-reset { padding: 10px 12px; }
}

.header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.btn-update { padding: 8px 16px; background: white; color: var(--accent); border: 2px solid white; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 700; cursor: pointer; text-transform: uppercase; white-space: nowrap; }
.btn-update:hover { background: rgba(255,255,255,0.85); }

.upload-panel { background: white; border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin-bottom: 24px; }
.upload-panel h3 { font-family: 'Montserrat', sans-serif; font-size: 13px; font-weight: 700; color: var(--accent); text-transform: uppercase; margin-bottom: 16px; letter-spacing: 0.5px; }
.drop-zone { border: 2px dashed var(--border2); border-radius: 6px; padding: 32px 20px; text-align: center; cursor: pointer; transition: border-color 0.2s, background 0.2s; }
.drop-zone:hover, .drop-zone.drag-over { border-color: var(--accent); background: var(--accent-bg); }
.drop-zone p { color: var(--accent); font-size: 14px; margin-bottom: 6px; }
.drop-zone small { color: var(--text3); font-size: 12px; }
.upload-actions { display: flex; gap: 10px; margin-top: 14px; align-items: center; flex-wrap: wrap; }
.btn-dl { padding: 8px 16px; background: var(--accent); color: white; border: none; border-radius: 4px; font-family: 'Montserrat', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; text-transform: uppercase; }
.btn-dl:hover { background: var(--accent2); }
.upload-status { font-size: 12px; color: var(--text3); font-family: 'Montserrat', sans-serif; }
.upload-status.ok { color: #3a8a3a; }
.upload-status.err { color: var(--accent2); }
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <div class="header-row">
      <div>
        <h1>📋 Seznam listin Otakara II.</h1>
        <p>Veškeré listiny s pokročilým filtrováním a stránkováním</p>
      </div>
      <button class="btn-update" onclick="toggleUploadPanel()">↑ Aktualizovat data</button>
    </div>
  </div>

  <div class="upload-panel" id="upload-panel" style="display:none">
    <h3>Zdroj dat — nahrání nové tabulky</h3>
    <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <p>Přetáhněte soubor xlsx sem nebo klikněte pro výběr</p>
      <small>Podporované formáty: .xlsx &nbsp;·&nbsp; List: <strong>PO II G def</strong></small>
    </div>
    <input type="file" id="file-input" accept=".xlsx" style="display:none" onchange="handleFile(this.files[0])">
    <div class="upload-actions">
      <button class="btn-dl" id="btn-download" style="display:none" onclick="downloadJson()">⬇ Stáhnout listiny_data.json</button>
      <span class="upload-status" id="upload-status"></span>
    </div>
  </div>

  <div class="filters">
    <div class="filter-group">
      <label>Období</label>
      <select id="periode-select">
        <option value="">Všechna</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Vydavatel</label>
      <select id="issuer-select">
        <option value="">Všichni</option>
        <option value="Ja">Otakar II.</option>
        <option value="-">Jiní</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Místo</label>
      <select id="place-select">
        <option value="">Všechna</option>
      </select>
    </div>
    <div class="filter-group">
      <label>Regest</label>
      <input type="text" id="regest-search" placeholder="text...">
    </div>
    <div class="filter-group">
      <label>Instituce</label>
      <select id="institution-select">
        <option value="">Všechny</option>
      </select>
    </div>
    <div class="filter-group">
      <button class="btn-reset" onclick="resetFilters()">↺ Reset</button>
    </div>
  </div>

  <div class="table-info">
    <span id="table-count">0 listin</span> | <span id="table-pages">0 stran</span>
  </div>

  <div class="table-wrapper">
    <table class="data-table">
      <thead>
        <tr>
          <th>Datum</th>
          <th>Místo</th>
          <th>Regest</th>
          <th>Instituce</th>
          <th>Auth.</th>
        </tr>
      </thead>
      <tbody id="table-body"></tbody>
    </table>
  </div>
  <div class="pagination" id="pagination"></div>
</div>

<script>
let ALL_DATA = [];

let currentPage = 1;
const itemsPerPage = 50;

function initFilters() {
  // Periody – přímo z dat
  const select = document.getElementById('periode-select');
  const periods = [...new Set(ALL_DATA.map(d => d.Periode).filter(Boolean))].sort();
  periods.forEach(p => {
    const opt = document.createElement('option');
    opt.value = p;
    opt.textContent = p;
    select.appendChild(opt);
  });
  
  // Místa
  const places = new Set();
  ALL_DATA.forEach(d => {
    if (d.lokalitat_name && d.lokalitat_name !== '???') {
      places.add(d.lokalitat_name);
    }
  });
  const placeSelect = document.getElementById('place-select');
  Array.from(places).sort().forEach(place => {
    const opt = document.createElement('option');
    opt.value = place;
    opt.textContent = place;
    placeSelect.appendChild(opt);
  });
  
  // Instituce
  const institutions = new Set();
  ALL_DATA.forEach(d => {
    if (d.beschenkte_institution_text) {
      let inst = d.beschenkte_institution_text;
      if (inst.length > 40) {
        inst = inst.substring(0, 37) + '...';
      }
      institutions.add(inst);
    }
  });
  const instSelect = document.getElementById('institution-select');
  Array.from(institutions).sort().forEach(inst => {
    const opt = document.createElement('option');
    opt.value = inst;
    opt.textContent = inst;
    instSelect.appendChild(opt);
  });
}

function getFilteredData() {
  const periode = document.getElementById('periode-select').value;
  const issuer = document.getElementById('issuer-select').value;
  const place = document.getElementById('place-select').value;
  const regestSearch = document.getElementById('regest-search').value.toLowerCase();
  const institution = document.getElementById('institution-select').value;
  
  return ALL_DATA.filter(d => {
    if (issuer && d.poII_aussteller !== issuer) return false;
    
    if (periode && d.Periode !== periode) return false;
    
    if (place && d.lokalitat_name !== place) return false;
    
    if (regestSearch) {
      const regest = (d.kurzes_regest || '').toLowerCase();
      if (!regest.includes(regestSearch)) {
        return false;
      }
    }
    
    if (institution) {
      let instCheck = d.beschenkte_institution_text;
      if (instCheck && instCheck.length > 40) {
        instCheck = instCheck.substring(0, 37) + '...';
      }
      if (instCheck !== institution) return false;
    }
    
    return true;
  });
}

function updateTable() {
  currentPage = 1;
  const data = getFilteredData();
  const totalPages = Math.ceil(data.length / itemsPerPage);
  const start = (currentPage - 1) * itemsPerPage;
  const pageData = data.slice(start, start + itemsPerPage);
  
  document.getElementById('table-count').textContent = data.length + ' listin';
  document.getElementById('table-pages').textContent = totalPages + ' stran';
  
  const rows = pageData.map(d => `
    <tr>
      <td><strong>${d.datum_text || '?'}</strong></td>
      <td>${d.lokalitat_name || '?'}</td>
      <td><small>${(d.kurzes_regest || '').substring(0, 80)}</small></td>
      <td><small>${(d.beschenkte_institution_text || '').substring(0, 50)}</small></td>
      <td>${d.verfalscht ? '✗' : '✓'}</td>
    </tr>
  `).join('');
  
  document.getElementById('table-body').innerHTML = rows || '<tr><td colspan="5" style="text-align: center; padding: 20px;">Žádné listiny</td></tr>';
  
  updatePagination(totalPages);
}

function updatePagination(totalPages) {
  const paginationDiv = document.getElementById('pagination');
  
  if (totalPages <= 1) {
    paginationDiv.innerHTML = '';
    return;
  }
  
  let html = '';
  
  if (currentPage > 1) {
    html += `<button onclick="goToPage(${currentPage - 1})">← Pred</button>`;
  }
  
  const startPage = Math.max(1, currentPage - 2);
  const endPage = Math.min(totalPages, currentPage + 2);
  
  if (startPage > 1) {
    html += '<button onclick="goToPage(1)">1</button>';
    if (startPage > 2) html += '<span>...</span>';
  }
  
  for (let i = startPage; i <= endPage; i++) {
    if (i === currentPage) {
      html += `<button class="active" onclick="goToPage(${i})">${i}</button>`;
    } else {
      html += `<button onclick="goToPage(${i})">${i}</button>`;
    }
  }
  
  if (endPage < totalPages) {
    if (endPage < totalPages - 1) html += '<span>...</span>';
    html += `<button onclick="goToPage(${totalPages})">${totalPages}</button>`;
  }
  
  if (currentPage < totalPages) {
    html += `<button onclick="goToPage(${currentPage + 1})">Dal →</button>`;
  }
  
  paginationDiv.innerHTML = html;
}

function goToPage(page) {
  currentPage = page;
  const data = getFilteredData();
  const totalPages = Math.ceil(data.length / itemsPerPage);
  const start = (currentPage - 1) * itemsPerPage;
  const pageData = data.slice(start, start + itemsPerPage);
  
  const rows = pageData.map(d => `
    <tr>
      <td><strong>${d.datum_text || '?'}</strong></td>
      <td>${d.lokalitat_name || '?'}</td>
      <td><small>${(d.kurzes_regest || '').substring(0, 80)}</small></td>
      <td><small>${(d.beschenkte_institution_text || '').substring(0, 50)}</small></td>
      <td>${d.verfalscht ? '✗' : '✓'}</td>
    </tr>
  `).join('');
  
  document.getElementById('table-body').innerHTML = rows;
  updatePagination(totalPages);
  document.querySelector('.table-wrapper').scrollIntoView({ behavior: 'smooth' });
}

function resetFilters() {
  document.getElementById('periode-select').value = '';
  document.getElementById('issuer-select').value = '';
  document.getElementById('place-select').value = '';
  document.getElementById('regest-search').value = '';
  document.getElementById('institution-select').value = '';
  updateTable();
}

document.getElementById('periode-select').addEventListener('change', updateTable);
document.getElementById('issuer-select').addEventListener('change', updateTable);
document.getElementById('place-select').addEventListener('change', updateTable);
document.getElementById('regest-search').addEventListener('input', updateTable);
document.getElementById('institution-select').addEventListener('change', updateTable);

fetch('listiny_data.json')
  .then(r => r.json())
  .then(data => {
    ALL_DATA = data;
    initFilters();
    updateTable();
  });

// ─── Upload & parse xlsx ──────────────────────────────────────────────────────

let parsedJson = null;

function toggleUploadPanel() {
  const p = document.getElementById('upload-panel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
}

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) handleFile(file);
});

function handleFile(file) {
  if (!file || !file.name.endsWith('.xlsx')) {
    setStatus('Neplatný soubor — očekáváno .xlsx', 'err');
    return;
  }
  setStatus('Načítám…', '');
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
      const sheetName = 'PO II G def';
      if (!wb.Sheets[sheetName]) {
        setStatus('List "' + sheetName + '" nebyl nalezen v souboru.', 'err');
        return;
      }
      const rows = XLSX.utils.sheet_to_json(wb.Sheets[sheetName], { defval: null });
      const COLS = ['no','sicherheit','Periode','datum_text','tag_post','monat_post','jahr_post',
        'feiertag','lokalitat_name','lokalitat_x','lokalitat_y','lokalitat_region',
        'lokalität_histland','kurzes_regest','beschenkte_institution_text',
        'bi1_lokalitatname','bi1_x','bi1_y','bi1_region','bi1_histland',
        'bi2_lokalitatname','bi2_region','bi2_histland',
        'bi3_lokalitatname','bi3_region','poII_aussteller','verfalscht'];
      parsedJson = rows
        .filter(r => r['no'] != null)
        .map(r => {
          const d = {};
          COLS.forEach(k => { let v = r[k]; d[k] = (v === 'xxx' || v === '') ? null : (v ?? null); });
          return d;
        });
      document.getElementById('btn-download').style.display = 'inline-block';
      setStatus('✓ Načteno ' + parsedJson.length + ' záznamů z listu "' + sheetName + '"', 'ok');
      // Aktualizuj live data na stránce
      ALL_DATA = parsedJson;
      initFilters();
      updateTable();
    } catch(err) {
      setStatus('Chyba při parsování: ' + err.message, 'err');
    }
  };
  reader.readAsArrayBuffer(file);
}

function downloadJson() {
  if (!parsedJson) return;
  const blob = new Blob([JSON.stringify(parsedJson, null, null)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'listiny_data.json';
  a.click();
}

function setStatus(msg, type) {
  const el = document.getElementById('upload-status');
  el.textContent = msg;
  el.className = 'upload-status' + (type ? ' ' + type : '');
}
</script>

</body>
</html>
