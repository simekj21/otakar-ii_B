name: Deploy na FTP

on:
  push:
    branches:
      - main
      - claude/transfer-session-context-Kms1U

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy na FTP (Wedos)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /www/domains/otakar-ii.medievalstudiesbrno.eu/otakar-analyza_B/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
